<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 — JHP</title>
<meta name="description" content="글 목록.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="/">JHP</a>
    <nav class="site-nav" aria-label="주요">
      <a href="/">홈</a>
      <a href="/docs/">문서</a>
      <a href="/blog/" aria-current="page">블로그</a>
      <a href="/calendar.html">캘린더</a>
      <a href="/start.html">즐겨찾기</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <h1>블로그</h1>
  <p class="lede" style="margin-top: var(--sp-3)">그때그때 쓰는 글.</p>

  <div id="list" class="state" style="margin-top: var(--sp-8)">불러오는 중…</div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© <span id="year">2026</span> JHP</span>
    <a href="/">홈으로</a>
  </div>
</footer>

<script src="/assets/js/content.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const box = document.getElementById('list');
  Content.loadJSON('/blog/posts/posts.json')
    .then((posts) => Content.renderList(box, Content.byNewest(posts), '/blog/post.html?slug='))
    .catch(() => Content.showError(box, '글 목록을 불러오지 못했습니다.'));
</script>
</body>
</html>
