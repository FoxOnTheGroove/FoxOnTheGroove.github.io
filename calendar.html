<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캘린더 — JHP</title>
<meta name="description" content="일정을 월 단위로.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<script src="/assets/js/theme.js"></script>
<style>
  .cal__bar {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    margin-bottom: var(--sp-6);
  }
  .cal__bar h2 { margin-right: auto; font-size: 1.25rem; }

  .cal__btn {
    display: grid;
    place-items: center;
    min-width: 32px;
    height: 32px;
    padding-inline: var(--sp-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-raised);
    color: var(--text-muted);
    font: inherit;
    font-size: 0.8125rem;
    cursor: pointer;
  }
  .cal__btn:hover { background: var(--bg-hover); color: var(--text); }

  .cal__grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .cal__weekday {
    padding: var(--sp-2);
    background: var(--bg-sunken);
    color: var(--text-faint);
    font-size: 0.75rem;
    font-weight: 600;
    text-align: center;
  }

  .cal__cell {
    min-height: 5.5rem;
    padding: var(--sp-2);
    background: var(--bg-raised);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cal__cell--blank { background: var(--bg-sunken); }

  .cal__num {
    font-size: 0.8125rem;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
  }
  .is-sunday .cal__num { color: #d05c5c; }

  .is-today { background: var(--accent-soft); }
  .is-today .cal__num {
    display: grid;
    place-items: center;
    width: 1.5rem; height: 1.5rem;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .cal__event {
    display: block;
    padding: 1px var(--sp-2);
    border-radius: 4px;
    background: var(--bg-sunken);
    border-left: 2px solid var(--text-faint);
    font-size: 0.6875rem;
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal__event--holiday { border-left-color: #d05c5c; }
  .cal__event--work    { border-left-color: #4a7ec4; }
  .cal__event--personal{ border-left-color: #4f9d69; }

  .upcoming__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-4);
    padding: var(--sp-3) 0;
  }

  @media (max-width: 640px) {
    .cal__cell { min-height: 3.5rem; padding: var(--sp-1); }
    .cal__event { font-size: 0; padding: 0; height: 4px; border-radius: 2px;
                  border-left: 0; background: var(--text-faint); }
    .cal__event--holiday { background: #d05c5c; }
    .cal__event--work    { background: #4a7ec4; }
    .cal__event--personal{ background: #4f9d69; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="/">JHP</a>
    <nav class="site-nav" aria-label="주요">
      <a href="/">홈</a>
      <a href="/docs/">문서</a>
      <a href="/blog/">블로그</a>
      <a href="/calendar.html" aria-current="page">캘린더</a>
      <a href="/start.html">즐겨찾기</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap wrap--wide">

  <div class="cal__bar">
    <h2 id="cal-label">—</h2>
    <button id="cal-prev"  class="cal__btn" type="button" aria-label="이전 달">‹</button>
    <button id="cal-today" class="cal__btn" type="button">오늘</button>
    <button id="cal-next"  class="cal__btn" type="button" aria-label="다음 달">›</button>
  </div>

  <div id="cal-grid" class="cal__grid"></div>

  <section style="margin-top: var(--sp-12)">
    <h2>다가오는 일정</h2>
    <div id="cal-upcoming" class="state">불러오는 중…</div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© <span id="year">2026</span> JHP</span>
    <a href="/docs/doc.html?slug=site-guide">일정 추가하는 법</a>
  </div>
</footer>

<script src="/assets/js/content.js"></script>
<script src="/assets/js/calendar.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
