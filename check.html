<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 지원 확인</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<script src="/assets/js/theme.js"></script>
<style>
  .row {
    display: flex; gap: var(--sp-3); align-items: baseline;
    padding: var(--sp-3) 0; border-bottom: 1px solid var(--border);
  }
  .row__label { flex: 1; }
  .row__value { font-weight: 600; font-size: 0.875rem; }
  .ok   { color: #3f8f5c; }
  .bad  { color: #c4483f; }
  .wait { color: var(--text-faint); }

  .btn {
    display: block; width: 100%;
    padding: var(--sp-3) var(--sp-4); margin-top: var(--sp-4);
    background: var(--accent); color: #fff;
    border: 0; border-radius: var(--radius);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn--ghost {
    background: transparent; color: var(--text-muted);
    border: 1px solid var(--border); font-weight: 400;
  }

  #log {
    margin-top: var(--sp-6); padding: var(--sp-4);
    background: var(--bg-sunken); border-radius: var(--radius);
    font-family: var(--font-mono); font-size: 0.75rem;
    white-space: pre-wrap; word-break: break-all;
    color: var(--text-muted);
  }
  .verdict {
    margin-top: var(--sp-6); padding: var(--sp-4);
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-raised);
  }
</style>
</head>
<body>

<main class="wrap" style="max-width: 34rem">
  <h1>기기 지원 확인</h1>
  <p class="lede" style="margin-top: var(--sp-3)">
    이 폰에서 지문으로 즐겨찾기를 잠글 수 있는지 확인합니다.
    아래 버튼을 위에서부터 차례로 눌러 주세요.
  </p>

  <div style="margin-top: var(--sp-8)">
    <div class="row">
      <span class="row__label">WebAuthn 사용 가능</span>
      <span class="row__value wait" id="r-api">…</span>
    </div>
    <div class="row">
      <span class="row__label">기기 내장 인증기 (지문·얼굴)</span>
      <span class="row__value wait" id="r-platform">…</span>
    </div>
    <div class="row">
      <span class="row__label">PRF 확장 <span class="meta">— 핵심</span></span>
      <span class="row__value wait" id="r-prf">…</span>
    </div>
    <div class="row">
      <span class="row__label">키 재현성 <span class="meta">— 같은 키가 다시 나오는가</span></span>
      <span class="row__value wait" id="r-stable">…</span>
    </div>
  </div>

  <button class="btn" id="btn-create" type="button">1. 지문 등록해 보기</button>
  <button class="btn" id="btn-verify" type="button" disabled>2. 지문으로 키 꺼내 보기</button>
  <button class="btn btn--ghost" id="btn-reset" type="button">기록 지우기</button>

  <div class="verdict" id="verdict" hidden></div>

  <p class="meta" style="margin-top: var(--sp-6)">
    이 페이지는 확인용입니다. 등록되는 패스키는 이 사이트 전용이고,
    폰의 <strong>설정 → 비밀번호 및 계정 → 패스키</strong>에서 지울 수 있습니다.
    확인이 끝나면 이 페이지는 사이트에서 삭제할 예정입니다.
  </p>

  <div id="log">준비됨.</div>
</main>

<script>
(function () {
  'use strict';

  const KEY = 'check.credId';
  const SALT = new TextEncoder().encode('bookmarks-key-v1');

  const logBox = document.getElementById('log');
  function log(msg) {
    logBox.textContent += '\n' + msg;
    logBox.scrollTop = logBox.scrollHeight;
  }

  function mark(id, ok, text) {
    const el = document.getElementById(id);
    el.className = 'row__value ' + (ok ? 'ok' : 'bad');
    el.textContent = text || (ok ? '가능' : '불가');
  }

  function b64(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }

  /* --- 1단계: 기본 지원 여부는 버튼 없이 바로 확인됩니다 --- */

  const hasAPI = !!(window.PublicKeyCredential && navigator.credentials);
  mark('r-api', hasAPI);
  if (!hasAPI) {
    log('WebAuthn 자체가 없습니다. 이 브라우저로는 불가능합니다.');
    document.getElementById('btn-create').disabled = true;
  } else {
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
      .then((available) => {
        mark('r-platform', available);
        log('내장 인증기: ' + (available ? '있음' : '없음'));
      })
      .catch((e) => { mark('r-platform', false); log('확인 실패: ' + e.message); });
  }

  /* --- 2단계: 패스키 등록. PRF를 쓸 수 있는지 여기서 드러납니다 --- */

  document.getElementById('btn-create').addEventListener('click', async () => {
    log('\n지문 등록을 요청합니다…');
    try {
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: '즐겨찾기 확인' },
          user: {
            id: crypto.getRandomValues(new Uint8Array(16)),
            name: 'owner',
            displayName: '주인',
          },
          pubKeyCredParams: [
            { type: 'public-key', alg: -7 },
            { type: 'public-key', alg: -257 },
          ],
          authenticatorSelection: {
            authenticatorAttachment: 'platform',
            userVerification: 'required',
            residentKey: 'required',
          },
          timeout: 60000,
          extensions: { prf: {} },
        },
      });

      const ext = cred.getClientExtensionResults();
      const prfEnabled = !!(ext.prf && ext.prf.enabled);

      localStorage.setItem(KEY, b64(cred.rawId));
      log('등록 성공.');
      log('PRF 지원 응답: ' + JSON.stringify(ext.prf || null));

      mark('r-prf', prfEnabled, prfEnabled ? '지원함' : '지원 안 함');
      document.getElementById('btn-verify').disabled = false;

      if (!prfEnabled) {
        log('→ 이 조합은 PRF를 지원하지 않습니다. 2번도 눌러 확인해 주세요.');
      }
    } catch (e) {
      mark('r-prf', false, '실패');
      log('등록 실패: ' + e.name + ' — ' + e.message);
    }
  });

  /* --- 3단계: 지문으로 키를 두 번 꺼내 같은 값인지 봅니다 --- */

  let firstKey = null;

  document.getElementById('btn-verify').addEventListener('click', async () => {
    const saved = localStorage.getItem(KEY);
    if (!saved) { log('먼저 1번을 눌러 주세요.'); return; }

    const rawId = Uint8Array.from(atob(saved), (c) => c.charCodeAt(0));
    log('\n지문 인증을 요청합니다…');

    try {
      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ type: 'public-key', id: rawId }],
          userVerification: 'required',
          timeout: 60000,
          extensions: { prf: { eval: { first: SALT } } },
        },
      });

      const ext = assertion.getClientExtensionResults();
      const result = ext.prf && ext.prf.results && ext.prf.results.first;

      if (!result) {
        mark('r-prf', false, '키 안 나옴');
        mark('r-stable', false, '확인 불가');
        log('인증은 됐지만 PRF 키가 나오지 않았습니다.');
        log('응답: ' + JSON.stringify(ext));
        finish(false);
        return;
      }

      mark('r-prf', true, '지원함');
      const key = b64(result);
      log('키를 받았습니다. 앞부분: ' + key.slice(0, 16) + '…');

      if (firstKey === null) {
        firstKey = key;
        log('→ 한 번 더 눌러서 같은 키가 나오는지 확인해 주세요.');
      } else {
        const stable = firstKey === key;
        mark('r-stable', stable, stable ? '같음' : '다름');
        log(stable
          ? '두 번 모두 같은 키입니다. 암호화에 쓸 수 있습니다.'
          : '키가 매번 다릅니다. 이 방식은 쓸 수 없습니다.');
        finish(stable);
      }
    } catch (e) {
      mark('r-stable', false, '실패');
      log('인증 실패: ' + e.name + ' — ' + e.message);
    }
  });

  function finish(ok) {
    const box = document.getElementById('verdict');
    box.hidden = false;
    box.innerHTML = ok
      ? '<strong>지문 방식으로 갈 수 있습니다.</strong><br>' +
        '<span class="meta">이 결과를 알려 주시면 즐겨찾기에 붙이겠습니다.</span>'
      : '<strong>지문 방식은 이 기기에서 어렵습니다.</strong><br>' +
        '<span class="meta">비밀번호 방식으로 설계를 바꾸겠습니다. ' +
        '위 로그를 그대로 알려 주세요.</span>';
  }

  document.getElementById('btn-reset').addEventListener('click', () => {
    localStorage.removeItem(KEY);
    firstKey = null;
    logBox.textContent = '기록을 지웠습니다. 1번부터 다시 하시면 됩니다.';
    document.getElementById('btn-verify').disabled = true;
  });
})();
</script>
</body>
</html>
