<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JHP</title>
<meta name="description" content="JHP의 개인 홈페이지 — 프로필, 문서, 블로그, 캘린더.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/home.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="/">JHP</a>
    <nav class="site-nav" aria-label="주요">
      <a href="/" aria-current="page">홈</a>
      <a href="/docs/">문서</a>
      <a href="/blog/">블로그</a>
      <a href="/calendar.html">캘린더</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap wrap--wide">

  <!-- 프로필 -->
  <section class="hero">
    <div class="hero__text">
      <p class="eyebrow">Seoul, KR</p>
      <h1>JHP</h1>
      <p class="lede">
        여기에 한두 문장으로 자기소개를 씁니다. 무슨 일을 하는지, 무엇에
        관심이 있는지 정도면 충분합니다.
      </p>
      <ul class="profile-links">
        <li><a href="https://github.com/FoxOnTheGroove">GitHub</a></li>
        <!-- 공개할 이메일 주소를 직접 넣으세요. 안 쓸 거면 이 줄을 지웁니다. -->
        <li><a href="mailto:you@example.com">이메일</a></li>
      </ul>
    </div>
    <img class="hero__avatar" src="/assets/img/avatar.svg" alt="" width="120" height="120">
  </section>

  <hr>

  <!-- 섹션 안내 -->
  <section class="stack">
    <h2>둘러보기</h2>
    <div class="grid">

      <a class="card card--section" href="/docs/">
        <span class="card__icon" aria-hidden="true">📄</span>
        <h3>문서</h3>
        <p class="meta">읽고 정리한 것들을 노션처럼 쌓아두는 곳.</p>
      </a>

      <a class="card card--section" href="/blog/">
        <span class="card__icon" aria-hidden="true">✏️</span>
        <h3>블로그</h3>
        <p class="meta">그때그때 쓰는 글.</p>
      </a>

      <a class="card card--section" href="/calendar.html">
        <span class="card__icon" aria-hidden="true">🗓</span>
        <h3>캘린더</h3>
        <p class="meta">일정과 기록을 월 단위로.</p>
      </a>

    </div>
  </section>

  <!-- 최근 글 — blog/posts/posts.json에서 자동으로 채워집니다. -->
  <section class="stack" style="margin-top: var(--sp-12)">
    <h2>최근 글</h2>
    <div id="recent-posts" class="state">불러오는 중…</div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© <span id="year">2026</span> JHP</span>
    <a href="https://github.com/FoxOnTheGroove/FoxOnTheGroove.github.io">소스</a>
  </div>
</footer>

<script src="/assets/js/content.js"></script>
<script src="/assets/js/home.js"></script>
</body>
</html>
