<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>즐겨찾기 — JHP</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css">
<script src="/assets/js/theme.js"></script>
<style>
  .start-head { text-align: center; margin-bottom: var(--sp-8); }
  .start-head__clock {
    font-size: 3rem; font-weight: 300; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .start-head__hello { color: var(--text-muted); margin-top: var(--sp-2); }

  .search {
    display: block; width: 100%; max-width: 28rem;
    margin: var(--sp-6) auto 0;
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text); font: inherit; font-size: 0.9375rem;
    text-align: center;
  }
  .search::placeholder { color: var(--text-faint); }
  .search:focus { outline: none; border-color: var(--accent); }

  .group + .group { margin-top: var(--sp-8); }
  .group__title {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-faint);
    margin-bottom: var(--sp-3);
  }

  .tiles {
    display: grid; gap: var(--sp-2);
    grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
  }

  .tile {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: inherit; text-decoration: none;
    transition: border-color 0.12s, transform 0.12s;
  }
  .tile:hover {
    border-color: var(--border-strong); transform: translateY(-1px);
    color: inherit;
  }

  .tile__icon {
    flex-shrink: 0; display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--bg-sunken); color: var(--text-muted);
    font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
    overflow: hidden;
  }
  .tile__icon img { width: 20px; height: 20px; border-radius: 3px; }

  .tile__name {
    font-size: 0.875rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="/">JHP</a>
    <nav class="site-nav" aria-label="주요">
      <a href="/">홈</a>
      <a href="/docs/">문서</a>
      <a href="/blog/">블로그</a>
      <a href="/calendar.html">캘린더</a>
      <a href="/start.html" aria-current="page">즐겨찾기</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="라이트/다크 테마 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap wrap--wide">
  <div class="start-head">
    <p class="start-head__clock" id="clock">--:--</p>
    <p class="start-head__hello" id="greeting"></p>
    <label class="sr-only" for="search">링크 검색</label>
    <input class="search" id="search" type="search" autocomplete="off"
           placeholder="검색하거나 바로 타이핑하세요">
  </div>

  <div id="board" class="state">불러오는 중…</div>
</main>

<script src="/assets/js/content.js"></script>
<script src="/assets/js/start.js"></script>
</body>
</html>
